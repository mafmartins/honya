# Releases are unsigned for now. When a certificate is configured (CSC_LINK on macOS,
# the Windows certificate settings), electron-builder signs the app and the bundled ffmpeg.
appId: dev.honya.app
asar: true
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: build/ffmpeg/${os}
    to: ffmpeg
win:
  target:
    - nsis
mac:
  target:
    - dmg
  binaries:
    - Contents/Resources/ffmpeg/ffmpeg
linux:
  target:
    - AppImage
